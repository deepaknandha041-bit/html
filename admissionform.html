<!DOCTYPE html>
<html>

<head>
    <title>College Admission Form</title>
</head>

<body bgcolor="lightblue">

    <center>
        <h1>COLLEGE ADMISSION FORM</h1>
    </center>

    <hr>

    <form>

        <table align="center" cellpadding="8">

            <tr>
                <td><b>Full Name</b></td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>

            <tr>
                <td><b>Email</b></td>
                <td><input type="email" placeholder="Enter your email"></td>
            </tr>

            <tr>
                <td><b>Phone</b></td>
                <td><input type="tel" placeholder="Enter your phone number"></td>
            </tr>

            <tr>
                <td><b>Date of Birth</b></td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td><b>Gender</b></td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                    <input type="radio" name="gender"> Other
                </td>
            </tr>

            <tr>
                <td><b>Department</b></td>
                <td>
                    <select>
                        <option>-- Select Department --</option>
                        <option>Computer Science</option>
                        <option>Information Technology</option>
                        <option>Artificial Intelligence</option>
                        <option>Electronics & Communication</option>
                        <option>Electrical & Electronics</option>
                        <option>Mechanical Engineering</option>
                        <option>Civil Engineering</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><b>Courses Interested</b></td>
                <td>
                    <input type="checkbox"> BCA
                    <input type="checkbox"> BBA
                    <input type="checkbox"> B.Sc CS
                    <input type="checkbox"> B.Com
                </td>
            </tr>

            <tr>
                <td><b>Address</b></td>
                <td>
                    <textarea rows="5" cols="25" placeholder="Enter your address"></textarea>
                </td>
            </tr>

            <tr>
                <td><b>Upload Photo</b></td>
                <td><input type="file"></td>
            </tr>

            <tr>
                <td><b>Nationality</b></td>
                <td>
                    <select>
                        <option>Indian</option>
                        <option>Other</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><b>Blood Group</b></td>
                <td>
                    <select>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><b>Declaration</b></td>
                <td>
                    <input type="checkbox">
                    I declare that the above information is true.
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

    <hr>

</body>

</html>
