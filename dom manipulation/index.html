<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>JavaScript DOM Manipulation</h1>

    <img id="image" src="https://picsum.photos/300/200" width="300">

    <p id="paragraph">Welcome to JavaScript DOM Manipulation.</p>

    <div id="container"></div>

    <button id="btnText">Change Paragraph</button>

    <button id="btnImage">Change Image</button>

    <button id="btnAdd">Add Paragraph</button>

    <button id="btnColor">Change Background</button>

    <button id="btnFont">Change Text Color</button>

    <button id="btnHide">Hide / Show Paragraph</button>

    <button id="btnRemove">Remove Paragraph</button>

    <script src="script.js"></script>

</body>
</html>
